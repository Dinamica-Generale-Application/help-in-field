name: Deploy (Dev)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to deploy (e.g. v2.0.1)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  NODE_VERSION: "20"

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "404.html"

      - name: Upload HTML (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp dist/404.html s3://${{ vars.S3_BUCKET }}/404.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/404.html"

      - name: Smoke test
        run: |
          echo "Waiting for invalidation to propagate..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.CLOUDFRONT_DOMAIN }}/" || echo "000")
          echo "Health check: HTTP $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "⚠️  Warning: Got HTTP $STATUS (may still be propagating)"
          fi

      - name: Summary
        run: |
          echo "### ✅ Deployed to DEV" >> $GITHUB_STEP_SUMMARY
          echo "- **Ref**: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: \`${{ vars.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ vars.CLOUDFRONT_DOMAIN }}/" >> $GITHUB_STEP_SUMMARY
