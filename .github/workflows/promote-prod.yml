name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to promote (e.g. v2.0.1). Must be already deployed on DEV.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  promote:
    name: Copy DEV → PROD
    runs-on: ubuntu-latest
    environment: production   # Requires manual approval (configure in GitHub Settings)
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format '${{ inputs.tag }}'. Expected v<X.Y.Z>"
            exit 1
          fi

      - name: Configure AWS credentials (PROD)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download from DEV S3
        run: |
          mkdir -p dist
          aws s3 sync s3://${{ vars.S3_BUCKET_DEV }}/ dist/
          echo "Downloaded $(find dist -type f | wc -l) files from DEV bucket"

      - name: Sync to PROD S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "404.html"

      - name: Upload HTML (no-cache)
        run: |
          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp dist/404.html s3://${{ vars.S3_BUCKET }}/404.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Smoke test
        run: |
          echo "Waiting for invalidation to propagate..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.CLOUDFRONT_DOMAIN }}/" || echo "000")
          echo "Health check: HTTP $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "⚠️  Warning: Got HTTP $STATUS (may still be propagating)"
          fi

      - name: Summary
        run: |
          echo "### 🚀 Promoted to PRODUCTION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ inputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source**: \`s3://${{ vars.S3_BUCKET_DEV }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Destination**: \`s3://${{ vars.S3_BUCKET }}/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ vars.CLOUDFRONT_DOMAIN }}/" >> $GITHUB_STEP_SUMMARY
