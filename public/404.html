<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Reindirizzamento…</title>
  <script>
    // SPA fallback: redirect all 404 routes to index.html preserving the path.
    // CloudFront custom error response (404 → /404.html) triggers this script,
    // which then redirects the browser to the SPA entry point at the same path.
    var path = window.location.pathname + window.location.search + window.location.hash;
    window.location.replace('/index.html' + (path !== '/' ? '?redirect=' + encodeURIComponent(path) : ''));
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=/index.html">
  </noscript>
</head>
<body>
  <p>Reindirizzamento in corso…</p>
</body>
</html>
